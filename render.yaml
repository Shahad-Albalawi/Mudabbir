# Render Blueprint — Mudabbir API (PHP via Docker)
services:
  - type: web
    name: mudabbir-backend-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://mudabbir-backend-api.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: HEALTH_DB_TIMEOUT_SECONDS
        value: "5"
      - key: MUDABBIR_HEALTH_SKIP_AI_PING
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: CACHE_DRIVER
        value: array
      - key: SESSION_DRIVER
        value: array
      - key: TRUSTED_PROXIES
        value: "*"
      - key: APP_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: GEMINI_API_KEY
        sync: false
      - key: FCM_SERVER_KEY
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MUDABBIR_LEGACY_JSON_BACKUP_URL
        value: https://raw.githubusercontent.com/Shahad-Albalawi/Mudabbir/backup/json-2026-08-12/mudabbir-json-2026-08-12-140250Z.tar.gz
      - key: MUDABBIR_SKIP_LEGACY_IMPORT
        value: "1"
      - key: TELESCOPE_ENABLED
        value: "false"
      - key: SENTRY_LARAVEL_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.0"
